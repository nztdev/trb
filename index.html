}

  M.counts[c.id]=(M.counts[c.id]||0)+1;S.since[c.id]=M.total;
  S.n.sinceBig=c.big?0:S.n.sinceBig+1;
  S.hist=[...S.hist,c.id].slice(-20);
  persist();renderDebug();
}
R.onPress(onPress);
R.onArrive(()=>{S.tags.delete('stuck');S.tags.delete('gravity_flipped');S.room='space';persist();talk('arrive',3500);renderDebug()});
R.onReady(()=>{if(!has('hint_hold')){S.tags.add('hint_hold');talk('hold',5000)}});
R.onDepart(()=>{S.tags.add('departed');talk('depart',3500)});
R.onBurn((sc,auto)=>{M.burn=M.burn||{n:0,best:0,last:0};const prev=M.burn.best,had=M.burn.n>0;M.burn.n++;M.burn.last=sc;M.burn.best=Math.max(prev,sc);talk(auto?'burnAuto':had&&sc>prev+.05?'burnRecord':had&&sc<prev-.25?'burnWorse':sc>.7?'burnGreat':sc>.35?'burnOk':'burnLate',3800);persist()});
R.onCruise(()=>talk('cruise',4000));
R.onAdmire(()=>talk('admire',4500));
R.onTurn(()=>talk('turn',3500));
R.onForward(()=>talk('forward',3000));
R.onPlanet(n=>talk(n,4200));
R.onExit(()=>talk('exitSS',5000));
R.onGalaxy(()=>{S.room='galaxy';R.setPower(jumpPower());persist();talk('galaxy1',4500)});
R.onGalMark(()=>talk('galaxy2',4500));
R.onJump(()=>talk('jump',3500));
R.onHome(()=>{S.room='space';S.tags.add('home');persist();R.setLoc(M.loc||null);talk('home',4500)});
R.onHomePick(()=>talk('homePick',6000));
R.onPicked((la,lo)=>{M.loc={lat:la,lon:lo,picked:true};persist()});
R.onHomeGo(()=>talk('homeGo',3500));
R.onHomeLand(()=>{S.n.homeDone=1;persist();const c=R.cityNear();talk(c?'homeCity':'homeNo',7000,c)});
R.onHomeEnd(()=>talk('homeEnd',7000));

/* ============ 6. BOOT ============ */
S.tags.delete('gravity_flipped');S.tags.delete('stuck');S.tags.delete('departed');if(S.tags.has('home'))R.setHomed(true);if(S.n.homeDone)R.setHomeDone(true);R.setLoc(M.loc||null);R.setPresent(S);R.setMood(mood());
let _m='Press it.';if(M.visits>0){const h=(Date.now()-M.last)/3.6e6,d=Math.floor(h/24);_m=h<1?'Back already.':d<1?'You came back.':d===1?'A day. You came back.':`${d} days. You came back.`}
R.begin(M.visits===0,()=>R.say(_m,3200),S.room);
M.visits++;persist();
addEventListener('visibilitychange',persist);

/* ============ 7. DEBUG ============ */
function renderDebug(){
  R.debug(`<b>presses</b> ${M.total} · <b>mood</b> ${mood()} · <b>fps</b> ${R.fps()}<br><b>gpu</b> ${R.gpu()}<br><b>room</b> ${S.room} · <b>loc</b> ${M.loc?(M.loc.lat===null?'approx lon '+M.loc.lon:M.loc.lat+', '+M.loc.lon):'none'}<br><b>tags</b> ${[...S.tags].join(', ')||'none'}<br><b>recent</b> ${S.hist.slice(-8).join(' → ')||'—'}<br><b>first press</b> ${new Date(M.first).toLocaleDateString()}<br><button id="reset">reset world</button> <button id="jmp">jump: sky</button> <button id="jnt">sky: night</button> <button id="jsp">jump: space</button> <button id="jdp">depart now</button> <button id="jpl">to planets</button> <button id="jgx">jump: galaxy</button> <button id="jnw">jump now</button> <button id="jhm">trip home</button> <button id="clr">forget my location</button> <button id="lq">toggle low quality</button>`);
  const b=document.getElementById('reset');if(b)b.onclick=()=>{Store.wipe();location.reload()};const j=document.getElementById('jmp');if(j)j.onclick=()=>{S.room='sky';persist();location.reload()};const jgx=document.getElementById('jgx');if(jgx)jgx.onclick=()=>{S.room='galaxy';persist();location.reload()};const jhm=document.getElementById('jhm');if(jhm)jhm.onclick=()=>{if(S.room!=='space'){S.room='space';S.tags.add('home');persist();location.reload();return}R.setLoc(M.loc||null);R.debugHome()};const jnw=document.getElementById('jnw');if(jnw)jnw.onclick=()=>R.debugJump();const jp=document.getElementById('jpl');if(jp)jp.onclick=()=>R.debugBurn(19);const jd=document.getElementById('jdp');if(jd)jd.onclick=()=>R.depart();const jn=document.getElementById('jnt');if(jn)jn.onclick=()=>{R.dusk(1);S.room='sky';persist();location.reload()};const js=document.getElementById('jsp');if(js)js.onclick=()=>{S.room='space';persist();location.reload()};const lqb=document.getElementById('lq');if(lqb)lqb.onclick=()=>{try{localStorage.setItem('rb:lq',localStorage.getItem('rb:lq')==='1'?'0':'1')}catch(e){}location.reload()};const cl=document.getElementById('clr');if(cl)cl.onclick=()=>{delete M.loc;M.asked=0;persist();renderDebug()};
}
document.getElementById('dbgBtn').onclick=()=>{document.getElementById('dbg').classList.toggle('on');renderDebug()};

/* keep the screen awake during the journey */
let _wl=null;const _lock=async()=>{try{if('wakeLock' in navigator&&!_wl){_wl=await navigator.wakeLock.request('screen');_wl.addEventListener('release',()=>_wl=null)}}catch(e){}};
addEventListener('pointerdown',_lock);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')_lock()});
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
