 {id:'clouds',fam:'sky',rm:'sky',w:3,cd:6,big:false,req:()=>room()==='sky',play(){R.clouds();talk('clouds')}},
 {id:'swing',fam:'world',w:2,cd:9,big:true,req:()=>true,play(){R.swing();talk('swing')}},
 {id:'orbit',fam:'world',w:2,cd:10,big:true,req:()=>true,play(){R.orbit();talk('orbit')}},
 {id:'grow',fam:'button',w:2,cd:7,big:true,req:()=>true,play(){const b=!has('big');b?S.tags.add('big'):S.tags.delete('big');R.grow(b);talk(b?'grow':'shrink')}},
 {id:'nothing',fam:'quiet',w:2,cd:0,big:false,req:()=>true,play(){R.dim();S.n.nothingRun++;if(S.n.nothingRun>=2){S.tags.add('suspicious');talk('suspicious')}else talk('nothing')}},
 {id:'flee',fam:'button',w:2,cd:6,big:true,req:()=>!has('button_fled')&&!has('stuck'),play(){S.tags.add('button_fled');R.flee(3);talk('flee')}},
 {id:'depart',fam:'space',rm:'space',w:10,cd:999,big:false,req:()=>room()==='space'&&!has('departed')&&(S.n.spaceN||0)>=5,play(){R.depart()}},
 {id:'stick',fam:'button',w:3,cd:7,big:true,req:()=>!has('stuck')&&!has('gravity_flipped')&&!has('button_fled'),play(){S.tags.add('stuck');S.n.stickLeft=4;R.stick();talk('stick');setTimeout(unstick,12000)}},
 {id:'gravity',fam:'world',w:.5,cd:90,big:true,req:()=>!has('gravity_flipped'),play(){S.tags.add('gravity_flipped');S.n.flipLeft=2;R.setFlip(true);talk('gravity');setTimeout(unflip,14000)}},
 {id:'pressback',fam:'mystery',w:3,cd:30,big:true,req:()=>M.total>=8&&!has('thing_below')&&!has('gravity_flipped'),play(){S.tags.add('thing_below');R.pushBack();R.say('',1)}},
 {id:'knock',fam:'mystery',w:4,cd:3,big:false,req:()=>has('thing_below')&&!has('door_present')&&!has('gravity_flipped'),play(){S.n.knocks++;R.knock();talk('knock',1400)}},
 {id:'door',fam:'mystery',w:6,cd:5,big:true,req:()=>has('thing_below')&&!has('door_present')&&S.n.knocks>=2&&!has('gravity_flipped'),play(){S.tags.add('door_present');R.door('show');talk('door',3200)}}
];
[['nothing','stage'],['swing','stage'],['pressback','stage'],['knock','stage'],['door','stage'],['ask','stage'],['flee','stage']].forEach(([i,r])=>C.find(c=>c.id===i).rm=r);
R.onCaught(()=>{S.tags.delete('button_fled');talk('caught');persist()});

/* ============ 5. ENGINE ============ */
function choose(){
  const pool=C.filter(c=>(!c.rm||c.rm===room())&&c.req()&&(S.since[c.id]===undefined||M.total-S.since[c.id]>=c.cd));
  const quietBias=S.n.sinceBig<2;
  const weighted=pool.map(c=>{let w=c.w/(1+(M.counts[c.id]||0)*.12);if(quietBias)w*=c.big?.15:3;if(c.id==='nothing')w+=Math.max(0,3-S.n.sinceBig)*.4;return[c,w]});
  let r=Math.random()*weighted.reduce((a,[,w])=>a+w,0);
  for(const[c,w]of weighted){if((r-=w)<=0)return c}
  return{id:'idle',big:false,play(){}};
}
function onPress(){
  M.total++;R.setMood(mood());if(room()==='space')S.n.spaceN=(S.n.spaceN||0)+1;if(has('gravity_flipped')&&--S.n.flipLeft<0)unflip();if(has('stuck')&&--S.n.stickLeft<0)unstick();if(room()==='sky')R.dusk(Math.min(1,R.duskVal()+.035),true);
  if(has('door_open')&&room()==='stage'){talk('travel',2200);R.travel('sky',()=>{S.tags.delete('gravity_flipped');S.tags.delete('stuck');S.room='sky';persist();renderDebug()});return}
  if(has('door_present')&&!has('door_open')){
    S.n.doorPresses++;
    if(S.n.doorPresses===5&&!S.n.mentionedDoor){S.n.mentionedDoor=1;talk('doorHint',3200);persist();return}
    if(S.n.doorPresses>=10){S.tags.add('door_open');R.door('open');talk('doorOpen',4000);persist();return}
  }
  const c=choose();
  if(c.id!=='nothing')S.n.nothingRun=0;
  c.play();
  M.counts[c.id]=(M.counts[c.id]||0)+1;S.since[c.id]=M.total;
  S.n.sinceBig=c.big?0:S.n.sinceBig+1;
  S.hist=[...S.hist,c.id].slice(-20);
  persist();renderDebug();
}
R.onPress(onPress);
R.onArrive(()=>{S.tags.delete('stuck');S.tags.delete('gravity_flipped');S.room='space';persist();talk('arrive',3500);renderDebug()});
R.onReady(()=>{if(!has('hint_hold')){S.tags.add('hint_hold');talk('hold',5000)}});
R.onDepart(()=>{S.tags.add('departed');talk('depart',3500)});
R.onBurn((sc,auto)=>{M.burn=M.burn||{n:0,best:0,last:0};const prev=M.burn.best,had=M.burn.n>0;M.burn.n++;M.burn.last=sc;M.burn.best=Math.max(prev,sc);talk(auto?'burnAuto':had&&sc>prev+.05?'burnRecord':had&&sc<prev-.25?'burnWorse':sc>.7?'burnGreat':sc>.35?'burnOk':'burnLate',3800);persist()});
R.onCruise(()=>talk('cruise',4000));

/* ============ 6. BOOT ============ */
S.tags.delete('gravity_flipped');S.tags.delete('stuck');S.tags.delete('departed');R.setPresent(S);R.setMood(mood());
let _m='Press it.';if(M.visits>0){const h=(Date.now()-M.last)/3.6e6,d=Math.floor(h/24);_m=h<1?'Back already.':d<1?'You came back.':d===1?'A day. You came back.':`${d} days. You came back.`}
R.begin(M.visits===0,()=>R.say(_m,3200),S.room);
M.visits++;persist();
addEventListener('visibilitychange',persist);

/* ============ 7. DEBUG ============ */
function renderDebug(){
  R.debug(`<b>presses</b> ${M.total} · <b>mood</b> ${mood()} · <b>fps</b> ${R.fps()}<br><b>gpu</b> ${R.gpu()}<br><b>room</b> ${S.room} · <b>loc</b> ${M.loc?(M.loc.lat===null?'approx lon '+M.loc.lon:M.loc.lat+', '+M.loc.lon):'none'}<br><b>tags</b> ${[...S.tags].join(', ')||'none'}<br><b>recent</b> ${S.hist.slice(-8).join(' → ')||'—'}<br><b>first press</b> ${new Date(M.first).toLocaleDateString()}<br><button id="reset">reset world</button> <button id="jmp">jump: sky</button> <button id="jnt">sky: night</button> <button id="jsp">jump: space</button> <button id="jdp">depart now</button> <button id="clr">clear location</button> <button id="lq">toggle low quality</button>`);
  const b=document.getElementById('reset');if(b)b.onclick=()=>{Store.wipe();location.reload()};const j=document.getElementById('jmp');if(j)j.onclick=()=>{S.room='sky';persist();location.reload()};const jd=document.getElementById('jdp');if(jd)jd.onclick=()=>R.depart();const jn=document.getElementById('jnt');if(jn)jn.onclick=()=>{R.dusk(1);S.room='sky';persist();location.reload()};const js=document.getElementById('jsp');if(js)js.onclick=()=>{S.room='space';persist();location.reload()};const lqb=document.getElementById('lq');if(lqb)lqb.onclick=()=>{try{localStorage.setItem('rb:lq',localStorage.getItem('rb:lq')==='1'?'0':'1')}catch(e){}location.reload()};const cl=document.getElementById('clr');if(cl)cl.onclick=()=>{delete M.loc;M.asked=0;persist();renderDebug()};
}
document.getElementById('dbgBtn').onclick=()=>{document.getElementById('dbg').classList.toggle('on');renderDebug()};
</script>
</body>
</html>
